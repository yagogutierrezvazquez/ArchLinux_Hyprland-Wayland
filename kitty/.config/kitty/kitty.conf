# ~/.config/kitty/kitty.conf
# Colors come from the wallpaper: colors.conf is generated by matugen
# (template: ~/.config/matugen/templates/kitty-colors.conf).

include colors.conf

# ---------- Font ----------
font_family      family="JetBrainsMono Nerd Font"
font_size        11.0
# ligatures on, except under the cursor
disable_ligatures cursor

# ---------- Window ----------
# Slightly see-through: Hyprland blurs the wallpaper behind it
# (hypr/modules/look.lua, decoration.blur)
background_opacity    0.85
# vertical horizontal
window_padding_width  10 14
confirm_os_window_close 0
enable_audio_bell     no

# ---------- Cursor ----------
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.6
cursor_stop_blinking_after 10
# short trail when the cursor jumps
cursor_trail              3

# ---------- Tabs (only shown with 2+ tabs) ----------
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style round
tab_bar_min_tabs    2
tab_title_template  " {index}  {title} "

# ---------- Misc ----------
url_style           curly
scrollback_lines    5000
copy_on_select      no
