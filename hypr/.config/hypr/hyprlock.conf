# Lock screen (hyprlock 0.9, hyprlang format: hyprlock has no Lua config).
# Lock: SUPER+L. Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Colors: generated by matugen from the desktop wallpaper, so the lock screen
# matches the rest of the system even with its own image.
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font Propo

general {
    hide_cursor = true
    ignore_empty_input = true      # a stray Enter doesn't count as a failed try (faillock: 3 = 10 min lockout)
}

# No fadeIn/fadeOut: fading needs a screenshot of the desktop (screencopy),
# which our permissions.lua doesn't grant hyprlock -> Hyprland asked for it on
# every first lock after boot. Without fades hyprlock never captures the screen.
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 2, snappy
}

# Lock wallpaper: ~/.local/state/wallpaper/lock is a link to an image in
# ~/lock_wallpapers (chosen in the SUPER+W picker). Blurred and darkened so
# the text always reads; plain $bg if the image is missing.
background {
    monitor =
    path = ~/.local/state/wallpaper/lock
    color = $bg
    blur_passes = 2
    blur_size = 5
    brightness = 0.6
    vibrancy = 0.2
}

# Clock: hours in the accent, minutes in white (same as the dashboard)
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $accent
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 175
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $fg
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 45
    halign = center
    valign = center
}

# Date (English, like the dashboard)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%A, %-d %B"
    color = $fg
    font_size = 16
    font_family = $font
    shadow_passes = 2
    position = 0, -45
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 280, 48
    rounding = 14
    outline_thickness = 2
    outer_color = $accentLo
    inner_color = $glass
    font_color = $fg
    font_family = $font
    placeholder_text = <span foreground="##ffffff80">Password</span>
    check_color = $accent
    fail_color = rgb(e5534b)              # fixed semantic red (same as Barça losses)
    fail_text = <i>$PAMFAIL</i>
    capslock_color = rgb(e8c46a)          # amber border = Caps Lock on
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    shadow_passes = 2
    position = 0, -125
    halign = center
    valign = center
}

# User at the bottom
label {
    monitor =
    text = 󰀄  $USER
    color = $fgDim
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
