# Idle: dim -> lock -> screen off -> suspend (hypridle 0.1, hyprlang format).
# Wiki: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Paused while an app inhibits idle: videos in the browser, or the dashboard's
# "Stay awake" tile (an idle inhibitor held by the Quickshell dock).

general {
    # `loginctl lock-session` (and every suspend, below) end up here.
    # No fade-in: on resume from sleep a half-faded lock would show the desktop.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    # Lock before any sleep: idle, dashboard button, lid close. hypridle holds
    # the suspend until hyprlock is really up (inhibit_sleep auto -> mode 3).
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 min: dim the screen to a third (-s saves the level, -r restores it)
listener {
    timeout = 150
    on-timeout = brightnessctl -s -n2 set $(( $(brightnessctl g) / 3 ))
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off (the lock is already up)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 15 min on battery: suspend. Plugged in it stays on (locked, screen off), so
# long downloads/updates keep running. Unplugging while idle suspends within a minute.
listener {
    timeout = 900
    on-timeout = systemctl suspend
    condition_cmd = [ "$(cat /sys/class/power_supply/ADP0/online)" = 0 ]
    condition_retry = 60
}
