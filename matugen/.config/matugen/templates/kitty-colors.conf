# ~/.config/kitty/colors.conf: GENERATED by matugen from the wallpaper.
# Don't edit here: edit ~/.config/matugen/templates/kitty-colors.conf

# Base: tinted with the wallpaper (same as Waybar/Quickshell)
background            {{colors.surface_container_lowest.default.hex}}
foreground            {{colors.on_surface.default.hex}}
cursor                <* if {{ mono }} *>{{mono_accent}}<* else *>{{colors.primary_container.default.hex | set_lightness: 65.0}}<* endif *>
cursor_text_color     {{colors.surface_container_lowest.default.hex}}
selection_background  {{colors.surface_container_high.default.hex}}
selection_foreground  {{colors.on_surface.default.hex}}
url_color             <* if {{ mono }} *>{{mono_accent}}<* else *>{{colors.primary_container.default.hex | set_lightness: 65.0}}<* endif *>

# Tabs
tab_bar_background    {{colors.surface_container_lowest.default.hex}}
active_tab_background <* if {{ mono }} *>{{mono_accent}}<* else *>{{colors.primary_container.default.hex | set_lightness: 65.0}}<* endif *>
active_tab_foreground {{colors.surface_container_lowest.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.outline.default.hex}}

# 16 ANSI colors. Black/white follow the wallpaper; the six hues are fixed
# (soft, readable on any dark tint) so red still means error, green success.
color0   {{colors.surface_container_high.default.hex}}
color8   {{colors.outline.default.hex}}
color7   {{colors.on_surface_variant.default.hex}}
color15  {{colors.on_surface.default.hex}}
color1   #f2726f
color9   #ff8f8c
color2   #8fd18a
color10  #a9e3a4
color3   #e8c46a
color11  #f2d68f
color4   #7aa7f0
color12  #9cc0ff
color5   #c592e8
color13  #d8afff
color6   #6fcfcf
color14  #91e2e2
