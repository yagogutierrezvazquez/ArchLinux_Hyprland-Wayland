# ~/.config/hypr/hyprlock-colors.conf: GENERATED by matugen from the wallpaper.
# Don't edit here: edit ~/.config/matugen/templates/hyprlock-colors.conf
# (hyprlang colors are rgb(hex)/rgba(hex + alpha), without the #; mono_accent = e8e8e8)
$bg       = rgb({{colors.surface_container_lowest.default.hex_stripped}})
$glass    = rgba({{colors.surface_container_lowest.default.hex_stripped}}b3)
$fg       = rgb({{colors.on_surface.default.hex_stripped}})
$fgDim    = rgb({{colors.outline.default.hex_stripped}})
$accent   = rgb(<* if {{ mono }} *>e8e8e8<* else *>{{colors.primary_container.default.hex_stripped | set_lightness: 65.0}}<* endif *>)
$accentLo = rgba(<* if {{ mono }} *>e8e8e8<* else *>{{colors.primary_container.default.hex_stripped | set_lightness: 65.0}}<* endif *>59)
